name: Job discovery regression tests

on:
  pull_request:
    paths:
      - "employer_portal/job_discovery.py"
      - "employer_portal/test_job_discovery.py"
      - "employer_portal/portfolio_api.py"
      - "employer_portal/urls.py"
      - ".github/workflows/job-discovery-tests.yml"
  push:
    branches:
      - main
    paths:
      - "employer_portal/job_discovery.py"
      - "employer_portal/test_job_discovery.py"
      - "employer_portal/portfolio_api.py"
      - "employer_portal/urls.py"
      - ".github/workflows/job-discovery-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run job-discovery regression tests
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py test employer_portal.test_job_discovery -v 2
